# lichess-bot configuration for Chessy (the keys of config.yml.default of lichess-bot that matter for Chessy).
# run.sh copies it into the lichess-bot folder with the path of the engine. See README.md in this folder.

# The token is read from the environment variable LICHESS_BOT_TOKEN (never write it here, never commit it)
token: "set LICHESS_BOT_TOKEN"
url: "https://lichess.org/"

engine:
  dir: "../Chessy/engine/build/install/chessy/bin/"  # Replaced by run.sh with the absolute path of the engine
  name: "chessy"                    # chessy.bat on Windows
  working_dir: ""
  protocol: "uci"
  ponder: true                      # Think on the opponent's time (UCI go ponder / ponderhit)

  polyglot:
    enabled: false                  # Polyglot books read by lichess-bot: off, Chessy plays its own book (OwnBook)

  draw_or_resign:
    resign_enabled: true            # Resign lost positions...
    resign_score: -3000             # ...when the score is this low (centipawns)...
    resign_moves: 10                # ...for this number of moves in a row
    resign_for_egtb_minus_two: false  # Resign when online_egtb says the game is lost (online_egtb is off)
    offer_draw_enabled: true        # Offer and accept draws in dead equal endgames
    offer_draw_score: 0             # ...when the score is within this margin (centipawns)...
    offer_draw_moves: 10            # ...for this number of moves in a row...
    offer_draw_pieces: 10           # ...with this number of pieces or fewer
    offer_draw_for_egtb_zero: false # Offer draws when online_egtb says the game is drawn (online_egtb is off)

  # Moves from online services, played by lichess-bot instead of asking Chessy: all off, so that Chessy plays every move
  # with its own style (they would play the moves of databases and Stockfish). They work from any computer (web APIs).
  online_moves:
    max_out_of_book_moves: 10       # Stop asking the online books after this number of positions without a move
    max_retries: 2                  # Retries of each online request
    chessdb_book:
      enabled: false                # chessdb.cn: a huge database of positions analyzed by engines
    lichess_cloud_analysis:
      enabled: false                # The analyses of Stockfish stored by Lichess (cloud evaluations)
    lichess_opening_explorer:
      enabled: false                # The opening explorer of Lichess: games of masters or of Lichess players
    online_egtb:
      enabled: false                # The tablebases of Lichess (up to 7 pieces) or chessdb; Chessy has its own up to 5 pieces

  # Tablebases probed by lichess-bot itself before asking the engine: off, Chessy probes its own Syzygy tables (SyzygyPath)
  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false                # Gaviota: another format of tablebases, with distance to mate

  uci_options:
    Style: Space                    # Space (the constrictor, default), Full (strongest), Material or Greedy (weakest)
    OwnBook: true                   # Opening book of Chessy (Opening: KingsIndian, French... to play only one opening)
    SyzygyPath: "tools/syzygy"      # Replaced by run.sh with the absolute path of the tablebases (if downloaded)
    # UCI_LimitStrength: true       # A weaker bot: UCI_Elo from 900 to 2800 in steps of 100
    # UCI_Elo: 1600
    Threads: 4                      # Lazy SMP: more threads are stronger, up to the cores of the machine (1 with UCI_Elo)
    Hash: 256                       # MB of transposition table
    Move Overhead: 100              # Milliseconds kept by Chessy for delays, on top of move_overhead

  silence_stderr: false

abort_time: 30
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 1000                 # Milliseconds kept by lichess-bot for network delays, increase it if the bot loses on time

# Correspondence games (days per move), not accepted (time_controls below)
correspondence:
  move_time: 60                     # Seconds to think per move
  checkin_period: 300               # Seconds between checks for the moves of the opponent, after disconnecting
  disconnect_time: 150              # Seconds without moves before disconnecting from the game
  ponder: false                     # Do not think on the opponent's time (days)

challenge:
  concurrency: 1                    # One game at a time
  sort_by: "best"
  preference: "none"
  accept_bot: true
  only_bot: false
  max_increment: 30
  min_increment: 0
  max_base: 3600
  min_base: 60
  variants:
    - standard
    - chess960
  time_controls:
    - bullet
    - blitz
    - rapid
    - classical
  modes:
    - casual
    - rated

greeting:
  hello: "Hi! I'm {me}, a chess engine that likes space. Good luck!"
  goodbye: "Good game!"
  hello_spectators: "I'm {me}: I gain space and squeeze my opponents. https://github.com/Carleslc/Chessy"
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: false          # Only play challenges (set true to challenge other bots when idle)
